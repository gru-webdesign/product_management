# Alembic za razvoj (pravljenje novih migracija iz terminala):
#   alembic revision --autogenerate -m "opis izmene"
# Aplikacija sama pokreće migracije pri startu (app/db/base.py), ovaj fajl joj nije potreban.
# URL baze se uzima iz app/config.py (ETAPA_DATA_DIR ili podrazumevani folder).

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
